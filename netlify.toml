[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api requests to the Render backend — UPDATE this URL after deploying to Render
[[redirects]]
  from = "/api/*"
  to = "https://alka-traders-api.onrender.com/api/:splat"  # ← Replace with your Render backend URL
  status = 200
  force = true

# Redirect all other routes to index.html for React Router SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://alka-traders-api.onrender.com https://api-m.paypal.com https://www.paypal.com https://*.sentry.io;  # ← Replace Render URL frame-src https://www.paypal.com https://sandbox.paypal.com; frame-ancestors 'self'; font-src 'self' data:; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
