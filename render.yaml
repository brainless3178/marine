# Render Blueprint — Alka Traders Backend API
# Docs: https://render.com/docs/blueprint-spec
# Auto-deploys on push to master branch

services:
  - type: web
    name: alka-traders-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: node dist/backend/src/server.js
    postDeployCommand: npx prisma migrate deploy
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: PORT
        value: 3001
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@alkatraders.com
      - key: RFQ_EMAIL
        value: rfq@alkatraders.com
      - key: EMERGENCY_EMAIL
        value: emergency@alkatraders.com
      - key: ADMIN_EMAIL
        value: admin@alkatraders.com
      - key: DEFAULT_SHIPPING_COST
        value: "25"
      - key: DEFAULT_TAX_RATE
        value: "0.08"
      - key: COMPANY_NAME
        value: Alka Traders
      - key: COMPANY_EMAIL
        value: info@alkatraders.com
      - key: WHATSAPP_NUMBER
        value: "919726900547"
      - key: LOG_LEVEL
        value: info
