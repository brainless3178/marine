# Render Blueprint — Alka Traders Backend API
# Docs: https://render.com/docs/blueprint-spec
# Auto-deploys on push to master branch

services:
  - type: web
    name: alka-traders-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    postDeployCommand: npx prisma migrate deploy
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Use Neon's serverless driver over HTTPS/443 instead of TCP/5432.
      # Set to "tcp" only on hosts that allow outbound 5432.
      - key: DB_DRIVER
        value: neon-http
      - key: DIRECT_URL
        sync: false
      # ⚠️ IMPORTANT: Set these to a fixed 64-char hex string in Render dashboard.
      # Do NOT use generateValue — every deploy would invalidate all existing auth tokens.
      # Generate one with: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: PORT
        value: 3001
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: sales@alkatraders.co
      - key: RFQ_EMAIL
        value: sales@alkatraders.co
      - key: EMERGENCY_EMAIL
        value: sales@alkatraders.co
      - key: ADMIN_EMAIL
        value: sales@alkatraders.co
      - key: DEFAULT_SHIPPING_COST
        value: "25"
      - key: DEFAULT_TAX_RATE
        value: "0.08"
      - key: COMPANY_NAME
        value: Alka Traders
      - key: COMPANY_EMAIL
        value: sales@alkatraders.co
      - key: WHATSAPP_NUMBER
        value: "918799095041"
      - key: LOG_LEVEL
        value: info
